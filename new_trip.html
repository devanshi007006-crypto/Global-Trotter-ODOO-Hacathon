<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="GlobalTrotter Create a New Trip (Screen 4) - Plan dates, destinations, and get AI travel suggestions.">
    <title>GlobalTrotter | Plan a New Trip (Screen 4)</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #090d16;
            color: #eeeeee;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            padding: 20px 0;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            padding: 25px 3%;
        }

        .title {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 16px;
            color: #f59e0b;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            margin: auto;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 16px;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(12px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .top-bar {
            height: 65px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 25px;
        }

        .logo {
            font-size: 20px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: #f59e0b;
        }

        .profile-link {
            padding: 6px 14px;
            border-radius: 20px;
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid rgba(245, 158, 11, 0.3);
            color: #f59e0b;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .section-title {
            padding: 16px 25px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 20px;
            font-weight: 700;
            color: #ffffff;
        }

        .trip-form {
            padding: 25px 30px 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 15px;
            font-weight: 600;
            color: #cbd5e1;
        }

        .form-group input {
            padding: 12px 16px;
            border-radius: 10px;
            background: rgba(7, 9, 19, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 12px rgba(245, 158, 11, 0.25);
        }

        .btn-submit-trip {
            padding: 14px 28px;
            border-radius: 12px;
            background: linear-gradient(135deg, #f59e0b, #d97706);
            border: none;
            color: #ffffff;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-submit-trip:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 158, 11, 0.4);
        }

        .suggestion-title {
            padding: 20px 25px 10px;
            font-size: 18px;
            font-weight: 700;
            color: #f59e0b;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .places-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            padding: 15px 25px 30px;
        }

        .place-card {
            height: 140px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .place-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.4s ease;
        }

        .place-card:hover img {
            transform: scale(1.1);
        }

        .place-card-name {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 8px 10px;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            font-size: 12px;
            font-weight: 700;
            color: #ffffff;
        }
    </style>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="page">

        <div class="title">
            <i class="fa-solid fa-plane-departure"></i> Create a new Trip <span>(Screen 4)</span>
        </div>

        <div class="container">

            <div class="top-bar">
                <div class="logo">Global<span>Trotter</span></div>
                <a href="login.html" class="profile-link" id="userAuthLink"><i class="fa-solid fa-user"></i> Account</a>
            </div>

            <div class="section-title">
                Plan a new trip & Sync to Odoo ERP
            </div>

            <form class="trip-form" onsubmit="handleCreateNewTrip(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="tripPlace"><i class="fa-solid fa-location-dot"></i> Select a Place / Destination *</label>
                        <input type="text" id="tripPlace" placeholder="e.g. Jaipur, Rajasthan" required>
                    </div>

                    <div class="form-group">
                        <label for="startDate"><i class="fa-solid fa-calendar"></i> Start Date *</label>
                        <input type="date" id="startDate" required>
                    </div>

                    <div class="form-group">
                        <label for="endDate"><i class="fa-solid fa-calendar-check"></i> End Date *</label>
                        <input type="date" id="endDate" required>
                    </div>

                    <div class="form-group">
                        <label for="tripBudget"><i class="fa-solid fa-indian-rupee-sign"></i> Target Budget (₹)</label>
                        <input type="number" id="tripBudget" placeholder="50000" value="50000">
                    </div>
                </div>

                <button type="submit" class="btn-submit-trip">
                    <i class="fa-solid fa-floppy-disk"></i> Create Trip & Generate Itinerary
                </button>
            </form>

            <div class="suggestion-title">
                <i class="fa-solid fa-lightbulb"></i> Suggestions for Places to Visit / Activities
            </div>

            <div class="places-grid">
                <div class="place-card">
                    <img src="https://images.unsplash.com/photo-1599661046289-e31897846e41?auto=format&fit=crop&w=400&q=80" alt="Amber Fort">
                    <div class="place-card-name">Amber Fort, Jaipur</div>
                </div>
                <div class="place-card">
                    <img src="https://images.unsplash.com/photo-1602643163983-ed0bafd397d7?auto=format&fit=crop&w=400&q=80" alt="Hawa Mahal">
                    <div class="place-card-name">Hawa Mahal</div>
                </div>
                <div class="place-card">
                    <img src="https://images.unsplash.com/photo-1512343879784-a960bf40e7f2?auto=format&fit=crop&w=400&q=80" alt="Goa Beaches">
                    <div class="place-card-name">Baga Beach, Goa</div>
                </div>
                <div class="place-card">
                    <img src="https://images.unsplash.com/photo-1602216056096-3b40cc0c9944?auto=format&fit=crop&w=400&q=80" alt="Kerala Backwaters">
                    <div class="place-card-name">Alleppey Backwaters</div>
                </div>
                <div class="place-card">
                    <img src="https://images.unsplash.com/photo-1548013146-72479768bada?auto=format&fit=crop&w=400&q=80" alt="Taj Mahal">
                    <div class="place-card-name">Taj Mahal, Agra</div>
                </div>
                <div class="place-card">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=400&q=80" alt="Varkala Cliff">
                    <div class="place-card-name">Varkala Cliff</div>
                </div>
            </div>

        </div>

    </div>

    <script>
        async function handleCreateNewTrip(e) {
            e.preventDefault();
            const place = document.getElementById("tripPlace").value.trim();
            const startDate = document.getElementById("startDate").value;
            const endDate = document.getElementById("endDate").value;
            const budget = document.getElementById("tripBudget").value;

            const tripObj = {
                id: Date.now(),
                destination: place,
                start_date: startDate,
                end_date: endDate,
                budget: budget,
                status: "Planned",
                created_at: new Date().toISOString()
            };

            // 1. Save in Client-side Local Database
            const existingTrips = JSON.parse(localStorage.getItem("gt_trips") || "[]");
            existingTrips.push(tripObj);
            localStorage.setItem("gt_trips", JSON.stringify(existingTrips));

            // 2. Sync to Odoo ERP Backend REST API Endpoint
            try {
                const response = await fetch("/api/v1/trips/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        destination: place,
                        days: 5,
                        budget: budget,
                        start_date: startDate,
                        end_date: endDate
                    })
                });
                if (response.ok) {
                    const result = await response.json();
                    console.log("Odoo Backend Trip Generated:", result);
                }
            } catch (err) {
                console.log("Odoo backend offline, saved in local database:", err);
            }

            alert("🎉 Trip to " + place + " successfully created and synchronized with Odoo ERP backend!");
            window.location.href = "trip_list.html";
        }

        document.addEventListener("DOMContentLoaded", function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById("startDate").value = today;
            
            const nextWeek = new Date(Date.now() + 5*24*60*60*1000).toISOString().split('T')[0];
            document.getElementById("endDate").value = nextWeek;

            const userAuthLink = document.getElementById("userAuthLink");
            const storedUser = localStorage.getItem("gt_user");
            if (storedUser && userAuthLink) {
                try {
                    const user = JSON.parse(storedUser);
                    if (user && user.isLoggedIn) {
                        userAuthLink.innerHTML = `<i class="fa-solid fa-user"></i> Hi, ${user.name.split(' ')[0]}`;
                    }
                } catch(e){}
            }
        });
    </script>
</body>
</html>
