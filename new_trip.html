<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTrotter - Plan a New Trip</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="page">

        <div class="title">
            New Trip
        </div>

        <div class="container">

            <div class="top-bar">
                <div class="logo">globalTrotter</div>
                <div class="profile"></div>
            </div>

            <div class="section-title">
                Plan a new trip
            </div>

            <div class="trip-form">

                <div class="form-row">
                    <label>Start Date:</label>
                    <input type="date">
                </div>

                <div class="form-row">
                    <label>Select a Place:</label>
                    <input type="text" placeholder="">
                </div>

                <div class="form-row">
                    <label>Start Date:</label>
                    <input type="date">
                </div>

                <div class="form-row">
                    <label>End Date:</label>
                    <input type="date">
                </div>

            </div>

            <div class="suggestion-title">
                Suggestion for Places to Visit/Activities to perform
            </div>

            <div class="places-grid">

                <div class="place-card">
                    <img src="Delhi.jpg" alt="Place 1">
                </div>

                <div class="place-card">
                    <img src="images/place2.jpg" alt="Place 2">
                </div>

                <div class="place-card">
                    <img src="images/place3.jpg" alt="Place 3">
                </div>

                <div class="place-card">
                    <img src="images/place4.jpg" alt="Place 4">
                </div>

                <div class="place-card">
                    <img src="images/place5.jpg" alt="Place 5">
                </div>

                <div class="place-card">
                    <img src="images/place6.jpg" alt="Place 6">
                </div>

            </div>

        </div>

    </div>

</body>
</html>
