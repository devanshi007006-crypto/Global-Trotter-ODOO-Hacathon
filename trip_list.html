<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTrotter | User Trip Listing</title>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header>
        <div class="logo">
            GLOBALTROTTER
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="screen3.html">My Trips</a>
            <a href="index.html#planner">Planner</a>
        </nav>
    </header>

    <section class="main-landing-section" id="trips">
        <div class="landing-wrapper">

            <div class="landing-controls">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" placeholder="Search bar ......">
                </div>

                <button class="control-btn" type="button">
                    <i class="fa-solid fa-layer-group"></i>
                    Group by
                </button>

                <button class="control-btn" type="button">
                    <i class="fa-solid fa-filter"></i>
                    Filter
                </button>

                <button class="control-btn" type="button">
                    <i class="fa-solid fa-arrow-down-a-z"></i>
                    Sort by...
                </button>
            </div>

            <div class="trip-category">
                <h3 class="category-title">Ongoing</h3>
                <div class="trip-overview-card glass-panel">
                    <div class="overview-content">
                        <h4>Short Overview of the Trip</h4>
                    </div>
                </div>
            </div>

            <div class="trip-category">
                <h3 class="category-title">Up-coming</h3>
                <div class="trip-overview-card glass-panel">
                    <div class="overview-content">
                        <h4>Short Overview of the Trip</h4>
                    </div>
                </div>
            </div>

            <div class="trip-category">
                <h3 class="category-title">Completed</h3>
                <div class="trip-overview-card glass-panel">
                    <div class="overview-content">
                        <h4>Short Overview of the Trip</h4>
                    </div>
                </div>
                <div class="trip-overview-card glass-panel">
                    <div class="overview-content">
                        <h4>Short Overview of the Trip</h4>
                    </div>
                </div>
            </div>

        </div>
    </section>

</body>
</html>
