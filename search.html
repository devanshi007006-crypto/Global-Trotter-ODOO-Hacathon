<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobalTrotter | Activity & City Search</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #0d0f17;
            --bg-card: rgba(255, 255, 255, 0.03);
            --bg-card-hover: rgba(255, 255, 255, 0.07);
            --border-color: rgba(255, 255, 255, 0.12);
            --border-focus: #6366f1;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', 'Outfit', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.25rem 5%;
            background: rgba(13, 15, 23, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            letter-spacing: 2px;
            color: #fff;
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .user-profile-icon {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-card-hover);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
        }

        .user-profile-icon:hover {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.12);
        }

        .main-search-section {
            padding: 2.5rem 0;
        }

        .search-wrapper {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .search-controls {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 240px;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box i {
            position: absolute;
            left: 1.2rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.8rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: var(--transition);
        }

        .search-box input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .control-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .control-btn:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .results-section {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .results-title {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .option-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 2.25rem 2rem;
            text-align: center;
            backdrop-filter: blur(8px);
            transition: var(--transition);
            cursor: pointer;
        }

        .option-card:hover {
            background: var(--bg-card-hover);
            border-color: rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            transform: translateY(-2px);
        }

        .option-content h4 {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        @media (max-width: 640px) {
            .search-controls {
                flex-direction: column;
            }

            .control-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            GlobalTrotter
        </div>
        <div class="user-profile-icon" title="Account Settings">
            <i class="fa-regular fa-user"></i>
        </div>
    </header>

    <section class="main-search-section">
        <div class="search-wrapper">

            <div class="search-controls">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" value="Paragliding" placeholder="Search activities or cities...">
                </div>

                <button class="control-btn" type="button">
                    <i class="fa-solid fa-layer-group"></i>
                    Group by
                </button>

                <button class="control-btn" type="button">
                    <i class="fa-solid fa-filter"></i>
                    Filter
                </button>

                <button class="control-btn" type="button">
                    <i class="fa-solid fa-arrow-down-a-z"></i>
                    Sort by...
                </button>
            </div>

            <h3 class="results-title">Results</h3>

            <div class="results-section">
                <div class="option-card">
                    <div class="option-content">
                        <h4>Option and its details</h4>
                    </div>
                </div>

                <div class="option-card">
                    <div class="option-content">
                        <h4>Option and its details</h4>
                    </div>
                </div>

                <div class="option-card">
                    <div class="option-content">
                        <h4>Option and its details</h4>
                    </div>
                </div>

                <div class="option-card">
                    <div class="option-content">
                        <h4>Option and its details</h4>
                    </div>
                </div>

                <div class="option-card">
                    <div class="option-content">
                        <h4>Option and its details</h4>
                    </div>
                </div>

                <div class="option-card">
                    <div class="option-content">
                        <h4>Option and its details</h4>
                    </div>
                </div>

                <div class="option-card">
                    <div class="option-content">
                        <h4>Option and its details</h4>
                    </div>
                </div>
            </div>

        </div>
    </section>

</body>
</html>
